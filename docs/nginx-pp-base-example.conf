# Vite base: '/pp/' 배포 시 Nginx 예시
#
# [배경]
# - Vite는 base가 '/pp/'여도 public/ 내용을 dist 루트에만 복사함.
#   → dist/img/, dist/anyid/, dist/index.html 존재. dist/pp/ 폴더는 없음.
# - 그래서 /pp/img/xxx, /pp/anyid/js/xxx 요청은
#   "경로에서 /pp/ 를 제거한 위치"인 dist/img/..., dist/anyid/... 에서 서빙해야 함.
#
# [현재 현상]
# - root + try_files 만 쓰면:
#   location /pp/ { root /path/to/dist; try_files $uri $uri/ /pp/index.html; }
#   → /pp/img/btn_swiper_next.png 요청 시 $uri = /pp/img/..., root 기준으로 dist/pp/img/... 조회
#   → 해당 경로 없음 → /pp/index.html 로 넘어감 → index.html(SPA) 반환 → React Router가 /pp/img/... 를 라우트로 인식 → 404 페이지
#
# [해결]
# - /pp/ 구간에는 root 가 아니라 alias 를 써서, "/pp/ 아래 경로"를 "dist 루트"에 매핑.
#   → /pp/img/xxx → dist/img/xxx, /pp/anyid/js/xxx → dist/anyid/js/xxx 로 조회되므로 정적 파일이 정상 반환됨.

server {
  listen 80;
  server_name dev.drugsafe.or.kr;

  # 루트 경로에서 anyid 정적 파일 서빙 (브라우저에서 http://dev.drugsafe.or.kr/anyid/js/manifest.js 로 접근 가능)
  # - 정적 이미지(/img/...)처럼 URL로 직접 열어서 내용 확인 가능
  location /anyid/ {
    alias /path/to/pp-fe/dist/anyid/;   # 실제 배포 경로로 변경 (끝에 / 필수)
  }

  # /pp/ 하위만 이렇게 처리 (alias 사용)
  location /pp/ {
    alias /path/to/pp-fe/dist/;   # 실제 배포 경로로 변경 (끝에 / 필수)
    try_files $uri $uri/ /pp/index.html;
  }

  # 나머지(루트 등)는 기존대로
  # location / { ... }
}
